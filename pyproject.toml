[project]
name = "handover-baseline"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = []

[dependency-groups]
# 公共依赖
common = [
    "numpy==1.26.*",
    "opencv-python>=4.8",
    "torch==2.6.0",
    "omegaconf>=2.3",
]

handover_baseline = [
    { include-group = "common" },
    "setuptools>=65,<80",
    "ultralytics>=8.0",
    "ur-rtde",
    "pyrobotiqgripper",
    "empy==3.3.4",
    "colcon-common-extensions>=0.3.0",
    "lark>=1.3.1",
    "colcon-core>=0.21.3",
    "pyrealsense2>=2.59.1.11053",
    "pyzed==5.6 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

Fast_FoundationStereo = [
    { include-group = "common" },
    "torchvision==0.21.0",
    "xformers",
    "timm",
    "einops",
    "scipy",
    "scikit-image",
    "imageio",
    "pyyaml",
    "open3d",
    # ONNX / TensorRT 依赖按需添加。
    "onnx>=1.23.2",
    "tensorrt-cu12>=10,<11",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
pyzed = { url = "https://download.stereolabs.com/zedsdk/5.6/whl/linux_x86_64/pyzed-5.6-cp310-cp310-linux_x86_64.whl" }
